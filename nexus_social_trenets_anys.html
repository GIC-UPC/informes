<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Nexus Social · Trenets per quadrimestre</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#77756f;--line:#e2e0da;--C:#2e8b57;--D:#7b4fa6;--B:#c8553d;--T:#b07d12}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#ecebe6;--mut:#9b9992;--line:#3a3936;--C:#4fbf83;--D:#a982d1;--B:#e57c62;--T:#d9a53a}}
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px}
.ctl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:12px;border-radius:3px}
.grid{display:grid;grid-template-columns:minmax(230px,300px) repeat(4,minmax(110px,1fr));min-width:820px}
.wrap{overflow-x:auto}
.h{font-weight:600;font-size:12px;color:var(--mut);padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.h:first-child{text-align:left}
.band{grid-column:1/-1;padding:14px 4px 4px;font-weight:700;font-size:13px;border-bottom:2px solid var(--a);color:var(--a)}
.note{grid-column:1/-1;padding:4px 4px 8px;color:var(--mut);font-style:italic;font-size:12px}
.lab,.c{border-bottom:1px solid var(--line);min-height:38px}
.lab{padding:6px 4px;display:flex;flex-direction:column;justify-content:center}
.lab b{font-weight:600}.lab small{color:var(--mut);font-size:11px}
.c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px}
.c.inL::before,.c.outR::after{content:"";position:absolute;top:50%;border-top:3px solid var(--a);z-index:0}
.c.inL::before{left:0;right:50%}.c.outR::after{left:50%;right:0}
.c.dash::before,.c.dashR::after{border-top-style:dashed}
.w,.g{position:relative;z-index:1;border-radius:5px;padding:2px 7px;font-size:11px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.w{background:var(--a);color:#fff}
.g{border:2px dashed var(--a);background:var(--bg);color:var(--mut);min-width:46px;text-align:center}
.x{position:relative;z-index:1;font-size:18px;font-weight:700;color:var(--a);background:var(--bg);padding:0 3px}
.sp{position:relative;z-index:1;font-size:11px;color:var(--a);background:var(--bg);padding:0 3px}
.br{position:relative;z-index:1;color:var(--a);font-size:16px;margin-left:50%;background:var(--bg)}
.antic .lab,.antic .w{opacity:.55}
body.noAntic .antic,body.noNou .nou{display:none}
.row{display:contents}
.wg{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:max-content}
.wg .w,.wg .g{max-width:none;overflow:visible}
.wg .w,.wg .g{white-space:nowrap;text-align:center}
.ws{font-size:10px;color:var(--mut);background:var(--bg);padding:0 3px;text-align:center;line-height:1.2}
@media print{
 :root{--bg:#fff;--fg:#1d1d1b;--mut:#666;--line:#ddd;--C:#2e8b57;--D:#7b4fa6;--B:#c8553d;--T:#b07d12}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{padding:0;width:calc(100% / var(--z));transform:scale(var(--z));transform-origin:0 0}.ctl label{display:none}.wrap{overflow:visible}
}
.tr{grid-column:2/-1;position:relative;border-bottom:1px solid var(--line)}
.tr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tr path{fill:none;stroke:var(--a);stroke-width:3;vector-effect:non-scaling-stroke}
</style></head><body>
<h1>Nexus Social · Trenets per quadrimestre</h1>
<p class="sub">Ús intern · dins el vagó: assignatura · escola; a sota: estudiants · PDI · taller de reptes 18/11/2026 · estat a 13/11/2026. El vagó indica que hi ha hagut una edició (no el nombre d'estudiants).</p>
<div class="ctl">
<label><input type="checkbox" id="a" checked> Mostra els antics</label>
<label><input type="checkbox" id="n" checked> Mostra les propostes del taller</label>
<div class="leg">
<span><i class="sw" style="background:var(--mut)"></i>edició</span>
<span><i class="sw" style="border:2px dashed var(--mut)"></i>possible (res segur)</span>
<span>✗ final de via</span>
</div></div>
<div class="wrap"><div class="grid" id="g"></div></div>
<script>
// Impressió: ?A1 (per defecte) o ?A2 · vertical, una sola pàgina
{const a2=/a2/i.test(location.search),s=document.createElement('style');
 s.textContent=`@page{size:${a2?'420mm 594mm':'594mm 841mm'};margin:10mm}:root{--z:${a2?1.15:1.62}}`;document.head.append(s);}
const Q=['25-26 Q1','25-26 Q2','26-27 Q1','26-27 Q2 (possible)'];
// cel·la: 0 buida · [etiquetes] vagons · 'g' fantasma · 'x' final · 's' es divideix · 'b' branca
const D=[
{k:'C',n:'Clima i sostenibilitat',r:[
 {id:'J0056',t:'Got retornable',e:'UPC Compromís social<br>línies: digitalització · adopció · disseny',
  n:[[0,1,'TFM','1 · Cervantes, Molins'],[1,0.4,'Empresa ×3 · EPSEVG','90 · Mir, Llorens, Díaz (coord. Berbegal)'],[1,1.6,'Sust. Design · IS.UPC','10 · Segalàs'],[2,0,'Beca · InLab','2'],[2,1,'Empresa ×5 · EPSEVG','130 · Díaz + 6 professores'],[3,1,'?','',1]],ed:[[0,1],[0,2],[1,3],[1,4],[4,5]]},
 {id:'J0061',t:'Sensors ambientals de baix cost',e:'Drone51 · el repte passa de tecnologia (sensors, dades) a aplicació (escoles, fàbriques, incendis)<br>coord. Sabaté (25-26) → Bragós (26-27)',
  n:[[1,0.5,'TEM · Telecos','15 · Alsina · dades'],[1,1.5,'TEM · Telecos','15 · Giménez · sensors'],[2,0,'INT EENG · Telecos','11 · Bermejo · escoles'],[2,1,'INT EENG · Telecos','8 · M. À. García · fàbriques'],[2,2,'INT EENG · Telecos','11 · Riu · incendis'],[3,0,'?','',1],[3,1,'?','',1],[3,2,'?','',1]],ed:[[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,5],[3,6],[4,7]]},
 {id:'J0058',t:'Smart UPC Recircula',e:'UPC Compromís social · 3 edicions en paral·lel · obert (relleu)',c:[0,[['Gest. TIC · EPSEVG','3 · Cuatrecasas'],['Gest. proj. · ETSEIB','5 · Cremades'],['TEM · Telecos','5 · Alsina']],'p','g']},
 {id:'NOU-06',t:'Boscos amb futur',e:'Fundació ResPir',p:1},
 {id:'NOU-08',t:'Escoltar el bosc',e:'Fundació ResPir',p:1},
 {id:'NOU-09',t:'Biodiversitat que podem observar',e:'Fundació ResPir',p:1},
 {id:'NOU-10',t:"El bosc entra a l'aula",e:'Fundació ResPir',p:1},
 {id:'NOU-11',t:'Aules Que Cremen + estació meteo',e:'AulesQueCremen',p:1},
 {id:'NOU-13',t:'Comunitat energètica amb biogàs',e:'Fundació Planes Corts',p:1}]},
{k:'D',n:'Desigualtats i gènere',r:[
 {id:'J0062',t:"IA per a l'assetjament a xarxes",e:'UPC Compromís social · coord. Bragós',c:[0,0,[['PAE · Telecos','14 · Fonollosa']],'g']},
 {id:'J0063',t:'Copa menstrual i lavabos',e:'UPC Compromís social',c:[0,0,[['Rec.-acció · IS.UPC','5 · Segalàs']],'g']},
 {id:'J0059',t:'NNK · Generador autònom',e:'NoNameKitchen',c:[0,[['Gest. proj. · ETSEIB','6 · Cremades']],0,0],o:1},
 {id:'J0060',t:'NNK · Visualitzador de rutes',e:'NoNameKitchen · coord. Bragós',c:[0,[['PAE · Telecos','6 · Umbert'],['PAE · Telecos','6 · Soneira']],0,0],o:1},
 {id:'NOU-01',t:'Tracking de roba amb RFID',e:'ASSIS',p:1},
 {id:'NOU-02',t:"Logística d'aliments sense llar",e:'ASSIS',p:1},
 {id:'NOU-03',t:'Aliments i retorn de carmanyoles',e:'FFiT',p:1}]},
{k:'B',n:'Benestar i salut',r:[
 {id:'J0057',t:'Disseny frugal per usabilitat',e:'Frugal4Health',c:[0,0,[['Usabilitat · EPSEVG','? · Díaz']],'g']},
 {id:'J0055',t:'Eines relacionals gent gran',e:'ASTEbcn',c:[[['Usabilitat · EPSEVG','18 · Díaz']],0,0,0],o:1},
 {id:'NOU-12',t:"Prevenció d'addiccions",e:'Dept. Salut',p:1},
 {id:'NOU-17',t:'Activitat física i salut mental',e:'Sport2Live',p:1},
 {id:'NOU-18',t:'App per a professionals',e:'Associació Tramuntana',p:1}]},
{k:'T',n:'Territori i urbanisme',note:'Cap repte actiu: només propostes.',r:[
 {id:'NOU-07',t:'Paisatge com a infraestructura social',e:'Fundació ResPir',p:1},
 {id:'NOU-14',t:"Telecomunicacions a la vinya d'alçada",e:'Fundació Planes Corts',p:1},
 {id:'NOU-15',t:'Plantes aromàtiques i medicinals',e:'Fundació Planes Corts',p:1}]}];
const g=document.getElementById('g'),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const wag=(lab,sub,gh)=>{const w=el('span','wg');w.append(el('span',gh?'g':'w',lab));if(sub)w.append(el('span','ws',sub));return w};
g.append(el('div','h','Repte · entitat'));Q.forEach(q=>g.append(el('div','h',q)));
D.forEach(b=>{const col=`var(--${b.k})`,band=el('div','band',b.n);band.style.setProperty('--a',col);g.append(band);
 if(b.note){const n=el('div','note',b.note);g.append(n)}
 b.r.forEach(r=>{const row=el('div','row'+(r.o?' antic':'')+(r.p?' nou':''));row.style.setProperty('--a',col);
  row.append(el('div','lab',`<b>${r.id} · ${r.t}</b><small>${r.e}${r.o?' · antic':''}${r.p?' · proposta del taller':''}</small>`));
  if(r.n){const L=Math.max(...r.n.map(x=>x[1])),X=q=>q*25+12.5,Y=l=>26+l*52,H=Y(L)+40,box=el('div','tr');box.style.height=H+'px';
   let s=`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none">`;
   r.ed.forEach(([a,b])=>{const A=r.n[a],B=r.n[b],x1=X(A[0]),y1=Y(A[1]),x2=X(B[0]),y2=Y(B[1]),m=(x1+x2)/2;
    s+=`<path d="M${x1} ${y1}C${m} ${y1},${m} ${y2},${x2} ${y2}"${B[4]?' stroke-dasharray="6 5"':''}/>`});
   box.innerHTML=s+'</svg>';
   r.n.forEach(([q,l,t,sub,gh])=>{const w=wag(t,sub,gh);w.style.cssText=`position:absolute;left:${X(q)}%;top:${Y(l)}px;transform:translate(-50%,-11px)`;box.append(w)});
   row.append(box);g.append(row);return}
  const c=r.p?[0,0,0,'g']:r.c;
  c.forEach((v,i)=>{const d=el('div','c'),dash=x=>x==='g'||x==='p';
   if(i>0&&c[i-1]&&v&&!r.p){d.classList.add('inL');if(dash(v))d.classList.add('dash')}
   if(i<3&&v&&c[i+1]){d.classList.add('outR');if(dash(c[i+1]))d.classList.add('dashR')}
   if(Array.isArray(v))v.forEach(([l,s])=>d.append(wag(l,s)));
   else if(v==='g')d.append(wag(r.p?'taller':'?','',1));
   else if(v==='x')d.append(el('span','x','✗'));
   row.append(d)});g.append(row)})});
const t=(id,cl)=>document.getElementById(id).onchange=e=>document.body.classList.toggle(cl,!e.target.checked);
t('a','noAntic');t('n','noNou');
</script></body></html>
