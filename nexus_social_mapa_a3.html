<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Nexus Social · Reptes i iniciatives per àmbit (4 × A3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1b;--mute:#666;--y:#FFE45C}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:#e9e9e6}
.wrap{display:flex;gap:10mm;padding:10mm;flex-wrap:wrap;justify-content:center}
.page{width:297mm;height:420mm;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{background:var(--c);color:#fff;padding:12mm 14mm 10mm}
.hd h1{font-family:'Space Grotesk',sans-serif;font-size:44pt;line-height:1;margin:0}
.hd p{margin:4mm 0 0;font-size:15pt}
.cloud{flex:1;min-height:0;padding:8mm 10mm 6mm;display:flex;flex-direction:column;gap:7mm}
.sec{display:flex;flex-direction:column;gap:3mm}
.sec:nth-child(2){margin-top:auto}
.sl{margin:0;font-size:12pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border-bottom:1.5px solid var(--c);padding-bottom:1.5mm}
.blk{display:flex;flex-wrap:wrap;gap:5mm;align-items:flex-start}
.br{flex-basis:100%;height:0}
.it{}
.rp{width:134mm;display:flex;flex-direction:column;justify-content:center;border:2.5px solid var(--ink);border-radius:4mm;padding:4mm 5mm;background:#fff}
.rp .cod{font-size:12pt;font-weight:700;color:#888}
.rp .t{font-family:'Space Grotesk',sans-serif;font-size:25pt;font-weight:700;line-height:1.12;margin:1mm 0 1.5mm}
.rp .m{font-size:14pt;color:#444}
.rp .rel{font-size:10.5pt;color:var(--c);font-weight:600;margin-top:1.5mm}
.chip{display:inline-block;align-self:flex-start;background:var(--y);border:1.5px solid var(--ink);border-radius:999px;padding:.8mm 3.5mm;font-size:13pt;font-weight:700;margin-bottom:1.5mm}
.rp.PA,.rp.TC{background:#ececec;color:#888;border-color:#bbb}
.rp.TC,.rp.PA{border:2.5px dotted #999}
.rp.PA .m,.rp.TC .m,.rp.PA .rel,.rp.TC .rel{color:#888}
.grp{width:142mm;border:2.5px dashed var(--c);border-radius:6mm;padding:4mm;display:flex;flex-direction:column;gap:3mm;background:color-mix(in srgb,var(--c) 6%,#fff)}
.grp .gk{font-size:12pt;font-weight:700;color:var(--c);letter-spacing:.03em}
.grp .rp{width:auto;padding:3mm 5mm}
.grp .rp .t{font-size:21pt}
.in{max-width:100mm;position:relative;padding:3mm 8mm 3mm 5mm;font-size:16pt;line-height:1.2;background:var(--c);clip-path:polygon(0 0,calc(100% - 5mm) 0,100% 5mm,100% 100%,0 100%)}
.in::before{content:'';position:absolute;inset:2.5px;background:#fff;clip-path:polygon(0 0,calc(100% - 5mm + 1px) 0,100% calc(5mm - 1px),100% 100%,0 100%)}
.in>*{position:relative}
.in small{display:block;font-size:11pt;color:#666;margin-top:.5mm}
.ec{width:120mm;border:2px solid var(--c);border-radius:4mm;padding:3.5mm 5mm;background:#fff}
.ec .k{font-size:11pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ec .t{font-size:18pt;font-weight:600;line-height:1.2;margin:1mm 0}
.ec .m{font-size:13pt;color:#555}
.ft{padding:4mm 12mm 7mm;border-top:1.5px solid #ddd;display:flex;flex-wrap:wrap;gap:2mm 6mm;font-size:12pt;color:#444;align-items:center}
.ft .sw{display:inline-block;width:9mm;height:4.5mm;border-radius:1.2mm;vertical-align:-1mm;margin-right:1.5mm}
.ft .brand{margin-left:auto;font-weight:600}
@page{size:297mm 420mm;margin:0}
@media print{body{background:#fff}.wrap{display:block;padding:0}.page{box-shadow:none;break-after:page}}
</style>
</head>
<body>
<div class="wrap" id="wrap">Carregant dades del mapa…</div>
<script>
const CL={A:['Sostenibilitat ambiental','Canvi climàtic, economia circular, residus i biodiversitat','#2E7D4F'],
S:['Salut i benestar','Autonomia, cures, soledat, salut comunitària i tecnologies de suport','#B0520A'],
D:['Reducció de desigualtats','Inclusió social, bretxa digital, accessibilitat, inserció laboral i gènere','#6B3FA0'],
T:['Desenvolupament territorial','Cohesió social, zones rurals, mobilitat i serveis comunitaris','#7A5230']};
const OFERTA=['R0','RO'];
const FITXA={RPT15:'ResPir: el bosc de Santa Magdalena com a laboratori',RPT21:'ResPir: el bosc de Santa Magdalena com a laboratori',RPT22:'ResPir: el bosc de Santa Magdalena com a laboratori',RPT17:'Estamariu, un poble que viu del que té',RPT18:'Estamariu, un poble que viu del que té',RPT19:'Estamariu, un poble que viu del que té'};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
// pseudoaleatori determinista per id (la disposició no canvia en recarregar)
function rnd(str,k){let h=2166136261^k;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%1000)/1000}
function jit(id){const r=(rnd(id,1)-.5)*3, dx=(rnd(id,2)-.5)*8, dy=(rnd(id,3)-.5)*8;return `--r:${r.toFixed(2)}deg;--dx:${dx.toFixed(1)}mm;--dy:${dy.toFixed(1)}mm`}
fetch('nexus_social_mapa.html').then(r=>r.text()).then(html=>{
 const doc=new DOMParser().parseFromString(html,'text/html');
 const lines=doc.getElementById('dades').textContent.trim().split('\n');
 const H=lines[0].split(';');
 const rows=lines.slice(1).filter(l=>l.trim()).map(l=>{const v=l.split(';');const o={};H.forEach((h,i)=>o[h]=(v[i]||'').trim());return o});
 let out='';
 for(const k of ['A','S','D','T']){
  const [nom,desc,c]=CL[k];
  const items=[];const seen={};
  for(const r of rows.filter(r=>r.cl===k&&['R','I','E'].includes(r.tipus))){
   if(r.tipus==='I'){const key=r.nom.toLowerCase();if(seen[key]){if(!seen[key].sub.includes(r.sub))seen[key].sub+=' · '+r.sub;continue}const c2={...r};seen[key]=c2;items.push(c2);continue}
   items.push(r);
  }
  // ordre: reptes per estat (oferta, actius, stand by, tancats), després iniciatives i ecosistema
  const ORD={R0:0,RO:1,R1:2,RC:2,PA:3,TC:3};
  const card=r=>{const chip=OFERTA.includes(r.estat)?'<div class="chip">Oferta Q2 26-27 · Q1 27-28</div>':'';
    const m=(r.estat==='TC'||r.estat==='PA')?'tancat · '+esc(r.impulsora):r.estat==='R1'?esc(r.impulsora)+' · <b>sense places noves al Q2</b>':esc(r.impulsora);
    return `${chip}<div class="cod">${esc(r.id)}</div><div class="t">${esc(r.nom)}</div><div class="m">${m}${r.ll?' · living lab '+esc(r.ll):''}</div>`};
  const R=items.filter(r=>r.tipus==='R').sort((a,b)=>(ORD[a.estat]??9)-(ORD[b.estat]??9)||a.id.localeCompare(b.id));
  const grp={};const R2=[];
  for(const r of R){const g=FITXA[r.id];if(g){if(!grp[g]){grp[g]={tipus:'G',nom:g,fills:[]};R2.push(grp[g])}grp[g].fills.push(r)}else R2.push(r)}
  let hR='',hI='',hE='';
  let pg=null;
  for(const r of R2){
   const g=r.tipus==='G'?0:(ORD[r.estat]??9); if(pg!==null&&pg<3&&g>=3) hR+='<div class="br"></div>'; pg=g;
   if(r.tipus==='G') hR+=`<div class="it grp"><div class="gk">Una fitxa · ${esc(r.nom)}</div>${r.fills.map(x=>`<div class="rp ${x.estat}">${card(x)}</div>`).join('')}</div>`;
   else hR+=`<div class="it rp ${r.estat}">${card(r)}</div>`;
  }
  for(const r of items.filter(r=>r.tipus==='I').sort((a,b)=>a.nom.localeCompare(b.nom,'ca')))
   hI+=`<div class="it in"><span>${esc(r.nom)}</span><small>${esc(r.sub)}</small></div>`;
  for(const r of items.filter(r=>r.tipus==='E'))
   hE+=`<div class="it ec"><div class="k">Ecosistema propi</div><div class="t">${esc(r.nom)}</div><div class="m">${esc(r.impulsora)}</div></div>`;
  const h=`<div class="sec"><p class="sl">Reptes</p><div class="blk">${hR}</div></div>`
   +(hI?`<div class="sec"><p class="sl">Iniciatives en marxa · Convo NS i Impacte</p><div class="blk">${hI}</div></div>`:'')
   +(hE?`<div class="sec"><p class="sl">Ecosistema propi</p><div class="blk">${hE}</div></div>`:'');
  out+=`<section class="page" style="--c:${c}">
<div class="hd"><h1>${nom}</h1><p>${desc}</p></div>
<div class="cloud">${h}</div>
<div class="ft"><span><span class="sw" style="background:var(--y);border:1.5px solid #1d1d1b"></span>s'ofereix</span>
<span><span class="sw" style="border:2px solid #1d1d1b"></span>repte</span>
<span><span class="sw" style="background:#ececec;border:2px dotted #999"></span>tancat</span>
<span><span class="sw" style="background:#fff;border:2px solid ${c};clip-path:polygon(0 0,calc(100% - 2mm) 0,100% 2mm,100% 100%,0 100%)"></span>iniciativa en marxa (Convo NS, Impacte)</span>
${k==='T'?'<span><span class="sw" style="border:2px solid '+c+'"></span>ecosistema propi</span>':''}
<span class="brand">Programa Nexus Social UPC · Gabinet d'Innovació i Comunitat UPC · 18/11/2026</span></div>
</section>`;
 }
 document.getElementById('wrap').innerHTML=out;
 // ordre màxim: títols d'una línia si cap (fins a 19 pt) i targetes de la mateixa alçada per full
 document.querySelectorAll('.page').forEach(p=>{
  // una sola mida de títol per full: la més petita que fa cabre en una línia els que hi poden cabre (mínim 19 pt)
  const ts=[...p.querySelectorAll('.rp .t')];let fsMin=25;
  ts.forEach(t=>{let fs=25;const lh=()=>parseFloat(getComputedStyle(t).lineHeight);
   while(t.scrollHeight>lh()*1.4&&fs>19){fs-=1;t.style.fontSize=fs+'pt'}
   if(t.scrollHeight<=lh()*1.4)fsMin=Math.min(fsMin,fs);});
  ts.forEach(t=>{t.style.fontSize=fsMin+'pt'});
  for(const sel of ['.rp','.in','.ec']){const els=[...p.querySelectorAll(sel)];
   const hmax=Math.max(0,...els.map(e=>e.getBoundingClientRect().height));
   els.forEach(e=>{e.style.height=hmax+'px'})}
 });
 // si un àmbit no hi cap, s'encongeix una mica fins que hi cap
 document.querySelectorAll('.cloud').forEach(c=>{let z=1;while(c.scrollHeight>c.clientHeight+2&&z>0.7){z-=0.03;c.style.zoom=z}});
 // ?A4p: un A4 per àmbit (A3 al 70,7 %)
 if(new URLSearchParams(location.search).has('A4p')){
  const st=document.createElement('style');
  st.textContent=`.page{zoom:0.70711}@page{size:210mm 297mm;margin:0}`;
  document.head.appendChild(st);
 }
 // ?A4: els 4 A3 en un sol A4 vertical (2×2), escala 1/(2·√2)
 if(new URLSearchParams(location.search).has('A4')){
  const w=document.getElementById('wrap');
  w.innerHTML=`<div class="a4"><div class="g">${w.innerHTML}</div></div>`;
  const st=document.createElement('style');
  st.textContent=`.a4{width:210mm;height:297mm;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.a4 .g{display:grid;grid-template-columns:297mm 297mm;width:594mm;zoom:0.35355}
.a4 .page{box-shadow:none;border:.6mm solid #fff}
@page{size:210mm 297mm;margin:0}
@media print{.a4{box-shadow:none}.a4 .page{break-after:auto}}`;
  document.head.appendChild(st);
 }
}).catch(e=>{document.getElementById('wrap').textContent='No s\'han pogut carregar les dades: '+e});
</script>
</body>
</html>
